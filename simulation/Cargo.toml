[workspace]
resolver = "3"
members = ["crates/openmat-sim", "crates/openmat-sim-llvm", "crates/openmat-sim-cli", "crates/openmat-opc", "crates/openmat-sim-slx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
