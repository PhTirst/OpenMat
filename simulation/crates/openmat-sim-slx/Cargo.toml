[package]
name = "openmat-sim-slx"
license = "AGPL-3.0-only"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
openmat-opc = { path = "../openmat-opc" }
openmat-sim = { path = "../openmat-sim" }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
openmat-parser = { path = "../../../crates/openmat-parser" }
openmat-hir = { path = "../../../crates/openmat-hir" }
openmat-source = { path = "../../../crates/openmat-source" }
openmat-syntax = { path = "../../../crates/openmat-syntax" }

[dev-dependencies]
openmat-sim-llvm = { path = "../openmat-sim-llvm" }
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
