[package]
name = "openmat-opc"
license = "AGPL-3.0-only"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
