name: OpenMat simulation kernel

on:
  push:
    paths: ['simulation/**', 'crates/openmat-parser/**', 'crates/openmat-hir/**', 'crates/openmat-source/**', 'crates/openmat-syntax/**', 'crates/openmat-server/**', 'Cargo.toml', 'Cargo.lock', 'docs/rfcs/0010-simulation-kernel-v0.md', 'docs/rfcs/0011-slx-import-v0.md', 'docs/rfcs/0013-m-function-cvode-v1.md', '.github/workflows/simulation.yml']
  pull_request:
    paths: ['simulation/**', 'crates/openmat-parser/**', 'crates/openmat-hir/**', 'crates/openmat-source/**', 'crates/openmat-syntax/**', 'crates/openmat-server/**', 'Cargo.toml', 'Cargo.lock', 'docs/rfcs/0010-simulation-kernel-v0.md', 'docs/rfcs/0011-slx-import-v0.md', 'docs/rfcs/0013-m-function-cvode-v1.md', '.github/workflows/simulation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo fmt --manifest-path simulation/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path simulation/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic
      - name: Reference and command-line tests
        run: cargo test --manifest-path simulation/Cargo.toml --locked --workspace
      - name: Prepare verified Windows LLVM runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $library = & ./simulation/tools/Prepare-Llvm.ps1 -Destination "$env:RUNNER_TEMP/openmat-sim-llvm"
          "OPENMAT_SIM_LLVM_LIBRARY=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require real Windows x64 ORC execution
        if: runner.os == 'Windows'
        run: cargo test --manifest-path simulation/Cargo.toml --locked -p openmat-sim-llvm --test native -- --ignored --nocapture
      - name: Require SLX import through real Windows ORC execution
        if: runner.os == 'Windows'
        run: cargo test --manifest-path simulation/Cargo.toml --locked -p openmat-sim-slx --test import -- --ignored --nocapture
      - name: Prepare verified serial SUNDIALS runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = & ./simulation/tools/Prepare-Sundials.ps1 -Destination "$env:RUNNER_TEMP/openmat-sim-sundials"
          "OPENMAT_SIM_SUNDIALS_DIRECTORY=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require real CVODE and compiled m function execution
        if: runner.os == 'Windows'
        run: cargo test --manifest-path simulation/Cargo.toml --locked -p openmat-sim-sundials --test native -- --ignored --nocapture
      - name: Require v1 and v2 server transport with native execution
        if: runner.os == 'Windows'
        run: cargo test --locked -p openmat-server --test simulation_transport -- --include-ignored
